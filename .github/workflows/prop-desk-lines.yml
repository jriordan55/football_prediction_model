# Republish DraftKings and Pinnacle lines for the prop desk.
# The phone page cannot call the odds board directly, so this job fetches
# the board and updates the static slate. Each sport can be run on its own.

name: Prop desk lines

on:
  workflow_dispatch:
    inputs:
      sport:
        description: Which slate to refresh
        required: true
        default: both
        type: choice
        options:
          - both
          - nfl
          - cfb
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: prop-desk-lines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy pandas pyarrow scipy

      - name: Cache play-by-play and game logs
        uses: actions/cache@v4
        with:
          path: |
            data/fastr_player_cache
            data/espn_cache
          key: prop-desk-cache-${{ runner.os }}

      - name: Refresh lines
        run: python -m nfl_open_prop.refresh_site "${{ github.event.inputs.sport || 'both' }}"

      - name: Attach the sim and last week's games
        run: python -m nfl_open_prop.publish_desk

      - name: Publish updated lines
        run: |
          git add prop_desk_site/desk.json prop_desk_site/index.html prop_desk_site/app.js
          git diff --cached --quiet && echo "No line changes" && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh prop desk lines."
          git push
