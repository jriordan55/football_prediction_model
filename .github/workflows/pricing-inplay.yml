name: Pricing in-play snapshot



on:

  schedule:

    # Every 5 minutes — runs even when your machine is off (GitHub-hosted)

    - cron: "*/5 * * * *"

  workflow_dispatch:



permissions:

  contents: write



concurrency:

  group: pricing-inplay

  cancel-in-progress: false



jobs:

  inplay:

    runs-on: ubuntu-latest

    env:

      FOURC_ODDS_ENABLED: "1"

      # Override in repo Settings → Secrets and variables → Actions if needed

      CFB_SEASON: "2026"

      CFB_WEEK: "3"

      NFL_SEASON: "2026"

      NFL_WEEK: "2"

    steps:

      - uses: actions/checkout@v4

        with:

          fetch-depth: 1



      - uses: actions/setup-python@v5

        with:

          python-version: "3.11"

          cache: pip

          cache-dependency-path: streamlit_app/requirements.txt



      - name: Install Python deps

        run: pip install -r streamlit_app/requirements.txt



      - name: Run in-play capture (CFB + NFL)

        run: python scripts/snapshot_inplay_pricing.py



      - name: Commit in-play artifacts

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f data/inplay_pricing data/pricing_history || true

          if git diff --staged --quiet; then

            echo "No in-play changes to commit."

          else

            git commit -m "chore: in-play pricing snapshot [skip ci]"

            git push

          fi

